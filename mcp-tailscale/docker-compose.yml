services:
  mcp-tailscale:
    build: .
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - /home/kaine:/home/kaine
      - /var/run/docker.sock:/var/run/docker.sock
  dashboard:
    build: .
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8081"
    env_file:
      - .env
    restart: unless-stopped
    command: python src/dashboard.py
    volumes:
      - ./src:/app/src
      - /home/kaine:/home/kaine

  ntfy:
    image: binwiederhier/ntfy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:80"
    volumes:
      - ntfy-data:/var/cache/ntfy
    restart: unless-stopped
    command: serve --cache-file /var/cache/ntfy/cache.db

  alerter:
    build: .
    env_file:
      - .env
    # No `environment:` block here on purpose. Compose's `environment:` key takes
    # precedence over `env_file:` for the same variable name — a hardcoded NTFY_URL/
    # NTFY_TOPIC/POLL_INTERVAL here would silently override whatever the operator set
    # in .env (e.g. pointing NTFY_TOPIC at ntfy.sh per the README's "or just use the
    # public ntfy.sh server" option). alerter.py already defaults to the same values
    # these used to hardcode, so unset .env vars behave identically; set ones now
    # actually take effect.
    restart: unless-stopped
    command: python -u src/alerter.py
    depends_on:
      - ntfy

volumes:
  ntfy-data:
