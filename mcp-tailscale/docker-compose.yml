services:
  # Read-only baseline: list_devices/get_offline_devices/get_device only. No shell,
  # no Docker socket, no access to anything outside the one narrow SHARED_DATA_DIR
  # mount below (which holds nothing but the shared action log). To opt into
  # run_command/restart_service/get_logs/disk_usage, see docker-compose.admin.yml.
  mcp-tailscale:
    build: .
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ${SHARED_DATA_DIR}:/data
  dashboard:
    build: .
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8081"
    env_file:
      - .env
    restart: unless-stopped
    command: python src/dashboard.py
    volumes:
      - ./src:/app/src
      - ${SHARED_DATA_DIR}:/data

  ntfy:
    image: binwiederhier/ntfy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:80"
    volumes:
      - ntfy-data:/var/cache/ntfy
    restart: unless-stopped
    command: serve --cache-file /var/cache/ntfy/cache.db

  alerter:
    build: .
    env_file:
      - .env
    environment:
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=homelab-alerts
      - POLL_INTERVAL=60
    restart: unless-stopped
    command: python -u src/alerter.py
    depends_on:
      - ntfy

volumes:
  ntfy-data:
